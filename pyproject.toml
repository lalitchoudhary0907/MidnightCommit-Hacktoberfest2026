[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docdrift"
version = "0.1.0"
description = "Automated Documentation Drift Detection"
authors = [{ name = "DocDrift Team" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[project.scripts]
docdrift = "docdrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["docdrift*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=docdrift"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []